name: ship
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  package-a:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: printf '%s' "$SIGNING_KEY" | sha256sum
  package-b:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: printf '%s' "$SIGNING_KEY" | sha256sum
  package-c:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: printf '%s' "$SIGNING_KEY" | sha256sum
